experiences:
  title: Experiences
  info:
  - role: Member of DaSLab (Data Science Laboratory) 
    time: 2024 - 2026
    company: 
    details: |
      Member of the Data Science Laboratory at UFES, a multidisciplinary environment dedicated to advancing Data Science in both applied and theoretical contexts. The laboratory develops projects in areas such as health, public safety, and reliability of components and systems.
  - role: Undergraduate Research at FAPES 
    time: 2024 - 2026
    details: |
      Conducted research in survival analysis applied to oncological data, with a focus on colorectal cancer cases from the Oncocentro Foundation of São Paulo (FOSP). Developed and applied Support Vector Machine (SVM) models adapted for censored data, as well as the Survival Random Machines model, to investigate prognostic factors and assess predictive performance.
  - role: Undergraduate Research at Oswaldo Cruz Foundation 
    time: 2023 - 2025
    details: |
      Developed an interactive Shiny/R dashboard with a multidisciplinary team for analyzing maternal-child health indicators in Brazil using public SUS data. The platform supports dynamic data visualization through interactive charts and tables, aiming to assist decision-making and promote transparency in public health information.
  - role: Undergraduate Research at Brazilian Obstetric Observatory (OOBr)  
    time: 2022 - 2026
    details: |
      Worked as an undergraduate researcher at OOBr, managing public data related to maternal health. My responsibilities included conducting statistical analyses, developing interactive dashboards, and creating data visualizations using R. In addition, I contributed to the preparation of statistical tutorials, supporting the dissemination of knowledge in the field.

