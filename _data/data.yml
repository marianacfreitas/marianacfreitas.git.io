career-profile:
  title: Career Profile
  summary: |
    Throughout my academic journey, I have developed a strong interest in the application of statistical methods to healthcare. I have worked with oncological data, maternal and child health, and public health indicators, applying statistical techniques and machine learning methods. 
    I have also gained solid experience in R and Shiny for exploratory data analysis and the development of interactive dashboards. My academic background includes survival analysis, machine learning methods for censored data, and the analysis of large-scale datasets, such as those from the Brazilian Unified Health System (SUS).
    In addition, I have participated in teaching projects, which helped me develop strong communication and didactic skills for explaining statistical concepts in a clear and objective way.

